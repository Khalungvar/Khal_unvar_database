<!doctype html>
<html lang="yi" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>קהל אונגוואר – מאגר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=47">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="importmap">
  {"imports": {
    "./js/app.js": "./js/app.js?v=47",
    "./js/config.js": "./js/config.js?v=47",
    "./js/data.js": "./js/data.js?v=47",
    "./js/donations.js": "./js/donations.js?v=47",
    "./js/hebdate.js": "./js/hebdate.js?v=47",
    "./js/google.js": "./js/google.js?v=47",
    "./js/i18n.js": "./js/i18n.js?v=47",
    "./js/names.js": "./js/names.js?v=47",
    "./js/occasions.js": "./js/occasions.js?v=47",
    "./js/places.js": "./js/places.js?v=47",
    "./js/util.js": "./js/util.js?v=47"
  }}
  </script>
  <script type="module">import "./js/app.js";</script>
</head>
<body>
  <!-- מסך התחברות -->
  <main id="login-view" class="login">
    <div class="login-card">
      <img class="login-logo" src="img/logo.png" alt="אונגוואר" width="240">
      <h1 data-i18n="appName">קהל אונגוואר</h1>
      <p data-i18n="subtitle"></p>
      <button id="btn-login" class="btn primary big" disabled data-i18n="login"></button>
      <p class="hint" data-i18n="loginHint"></p>
      <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="yi">אידיש</button><button type="button" data-lang="en">English</button></div>
    </div>
  </main>

  <!-- המסך הראשי -->
  <div id="app-view" hidden>
    <header class="topbar">
      <strong class="brand"><img src="img/logo-small.png" alt="" height="48"><span data-i18n="appName"></span></strong>
      <button id="btn-menu" class="btn ghost menu-toggle" aria-label="Menu">☰</button>
      <span class="spacer"></span>
      <span id="user-email" class="muted"></span>
      <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="yi">אידיש</button><button type="button" data-lang="en">English</button></div>
      <button id="btn-refresh" class="btn ghost" data-i18n="refresh" data-i18n-title="refreshTitle"></button>
      <button id="btn-logout" class="btn ghost" data-i18n="logout"></button>
    </header>

    <div class="app-body">
    <aside id="side-menu" class="side-menu">
      <div class="side-section">
        <h3 class="side-title" data-i18n="tabOrgs"></h3>
        <nav id="org-side"></nav>
      </div>
      <div class="side-section">
        <h3 class="side-title" data-i18n="campaigns"></h3>
        <nav id="campaign-side"></nav>
        <button type="button" class="btn small-btn side-new" id="btn-side-campaign" data-i18n="newCampaign"></button>
      </div>
    </aside>
    <div class="app-main">
    <nav class="tabs">
      <button type="button" data-view="contacts" class="on" data-i18n="tabContacts"></button>
      <button type="button" data-view="donations" data-i18n="tabDonations"></button>
      <button type="button" data-view="occasions" data-i18n="tabOccasions"></button>
    </nav>

    <main class="page view" data-view="contacts">
      <div class="toolbar">
        <input id="search" type="search" data-i18n-ph="searchPh" autocomplete="off">
        <select id="tag-filter" aria-label="Tags"></select>
        <select id="area-filter" aria-label="Area"></select>
        <select id="org-filter" aria-label="Organization"></select>
        <label class="check" id="org-former-wrap" hidden><input type="checkbox" id="org-former"> <span data-i18n="withFormer"></span></label>
        <label class="check"><input type="checkbox" id="show-inactive"> <span data-i18n="inclInactive"></span></label>
        <span class="spacer"></span>
        <button id="btn-new" class="btn primary" data-i18n="newContact"></button>
      </div>
      <p id="count" class="muted"></p>
      <div id="list" class="list"></div>
    </main>

    <main class="page view" data-view="donations" hidden>
      <div class="toolbar">
        <input id="don-search" type="search" data-i18n-ph="donSearchPh" autocomplete="off">
        <select id="don-tag" aria-label="Event"></select>
        <select id="don-year" aria-label="Year"></select>
        <select id="don-org" aria-label="Organization"></select>
        <label class="check"><input type="checkbox" id="don-unpaid"> <span data-i18n="onlyUnpaid"></span></label>
        <span class="spacer"></span>
        <button id="btn-campaign" class="btn" data-i18n="campaignBtn"></button>
        <button id="btn-new-donation" class="btn primary" data-i18n="newDonation"></button>
      </div>
      <p id="don-summary" class="muted"></p>
      <div id="don-list" class="list"></div>
    </main>

    <main class="page view" data-view="occasions" hidden>
      <div class="toolbar">
        <input id="occ-search" type="search" data-i18n-ph="occSearchPh" autocomplete="off">
        <select id="occ-type" aria-label="Type"></select>
        <select id="occ-range" aria-label="Range">
          <option value="7" data-i18n="range7"></option>
          <option value="14" data-i18n="range14"></option>
          <option value="31" data-i18n="range31"></option>
          <option value="400" data-i18n="rangeYear"></option>
        </select>
        <span class="spacer"></span>
        <button id="btn-print-occ" class="btn" data-i18n="print"></button>
        <button id="btn-new-occasion" class="btn primary" data-i18n="newOccasion"></button>
      </div>
      <h2 id="occ-print-title" class="print-only"></h2>
      <p id="occ-summary" class="muted"></p>
      <div id="occ-list" class="list"></div>
    </main>

    <main class="page view" data-view="campaign" hidden>
      <section id="campaign-main"></section>
    </main>

    <main class="page view" data-view="orgs" hidden>
      <section id="org-main" class="org-main"></section>
    </main>
    </div>
    </div>
  </div>

  <!-- כרטיס אישי -->
  <dialog id="card-dialog" class="sheet">
    <button type="button" class="x-close" data-close aria-label="Close">✕</button>
    <div id="card-body"></div>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn" id="card-edit" data-i18n="edit"></button>
      <button type="button" class="btn primary" data-close data-i18n="close" id="card-close"></button>
    </div>
  </dialog>

  <!-- טופס -->
  <dialog id="form-dialog" class="sheet wide">
    <form id="contact-form" novalidate></form>
  </dialog>

  <!-- טופס תרומה -->
  <dialog id="donation-dialog" class="sheet wide">
    <form id="donation-form" novalidate></form>
  </dialog>

  <!-- קאמפיין: הרבה נדבות בבת אחת (לא נסגר בלחיצה בחוץ) -->
  <dialog id="campaign-dialog" class="sheet full">
    <form id="campaign-form" novalidate></form>
  </dialog>

  <!-- טופס מאורע -->
  <dialog id="occasion-dialog" class="sheet wide">
    <form id="occasion-form" novalidate></form>
  </dialog>

  <!-- חלון בחירה -->
  <dialog id="choice-dialog" class="small">
    <h3 id="choice-title"></h3>
    <p id="choice-text"></p>
    <div id="choice-buttons" class="actions"></div>
  </dialog>

  <div id="toast" role="status" hidden></div>
</body>
</html>
