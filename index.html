<!doctype html>
<html lang="yi" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>קהל אונגוואר – מאגר</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=22">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="importmap">
  {"imports": {
    "./js/app.js": "./js/app.js?v=22",
    "./js/config.js": "./js/config.js?v=22",
    "./js/data.js": "./js/data.js?v=22",
    "./js/google.js": "./js/google.js?v=22",
    "./js/i18n.js": "./js/i18n.js?v=22",
    "./js/names.js": "./js/names.js?v=22",
    "./js/places.js": "./js/places.js?v=22",
    "./js/util.js": "./js/util.js?v=22"
  }}
  </script>
  <script type="module">import "./js/app.js";</script>
</head>
<body>
  <!-- מסך התחברות -->
  <main id="login-view" class="login">
    <div class="login-card">
      <img class="login-logo" src="img/logo.png" alt="אונגוואר" width="240">
      <h1 data-i18n="appName">קהל אונגוואר</h1>
      <p data-i18n="subtitle"></p>
      <button id="btn-login" class="btn primary big" disabled data-i18n="login"></button>
      <p class="hint" data-i18n="loginHint"></p>
      <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="yi">אידיש</button><button type="button" data-lang="en">English</button></div>
    </div>
  </main>

  <!-- המסך הראשי -->
  <div id="app-view" hidden>
    <header class="topbar">
      <strong class="brand"><img src="img/logo-small.png" alt="" height="48"><span data-i18n="appName"></span></strong>
      <span class="spacer"></span>
      <span id="user-email" class="muted"></span>
      <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="yi">אידיש</button><button type="button" data-lang="en">English</button></div>
      <button id="btn-refresh" class="btn ghost" data-i18n="refresh" data-i18n-title="refreshTitle"></button>
      <button id="btn-logout" class="btn ghost" data-i18n="logout"></button>
    </header>

    <main class="page">
      <div class="toolbar">
        <input id="search" type="search" data-i18n-ph="searchPh" autocomplete="off">
        <select id="tag-filter" aria-label="Tags"></select>
        <select id="area-filter" aria-label="Area"></select>
        <label class="check"><input type="checkbox" id="show-inactive"> <span data-i18n="inclInactive"></span></label>
        <span class="spacer"></span>
        <button id="btn-new" class="btn primary" data-i18n="newContact"></button>
      </div>
      <p id="count" class="muted"></p>
      <div id="list" class="list"></div>
    </main>
  </div>

  <!-- כרטיס אישי -->
  <dialog id="card-dialog" class="sheet">
    <button type="button" class="x-close" data-close aria-label="Close">✕</button>
    <div id="card-body"></div>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn" id="card-edit" data-i18n="edit"></button>
      <button type="button" class="btn primary" data-close data-i18n="close" id="card-close"></button>
    </div>
  </dialog>

  <!-- טופס -->
  <dialog id="form-dialog" class="sheet wide">
    <form id="contact-form" novalidate></form>
  </dialog>

  <!-- חלון בחירה -->
  <dialog id="choice-dialog" class="small">
    <h3 id="choice-title"></h3>
    <p id="choice-text"></p>
    <div id="choice-buttons" class="actions"></div>
  </dialog>

  <div id="toast" role="status" hidden></div>
</body>
</html>
