<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>קהל אונגוואר</title>
<link rel="stylesheet" href="/f/fam.css?v=15">
</head>
<body>
<main id="fam"></main>
<script>
  // ungvar.org/OrHatorah בכל צורת כתיבה (אותיות קטנות/גדולות) → דף הקמפיין
  if (/^\/orhatorah\/?$/i.test(location.pathname)) {
    try { if (!localStorage.getItem('pub:lang')) localStorage.setItem('pub:lang', '"yi"'); } catch (e) { /* */ }
    location.replace('/campaign.html?c=orhatorah' + (location.search ? '&' + location.search.slice(1) : ''));
  }
  // ungvar.org/f/<כתובת> — דף משפחה. כל השאר: לא נמצא.
  if (/^\/f\/[^/]+\/?$/.test(location.pathname)) {
    var s = document.createElement('script'); s.type = 'module'; s.src = '/f/fam.js?v=19'; document.body.appendChild(s);
  } else {
    document.getElementById('fam').innerHTML = '<p class="fam-msg">הדף לא נמצא · Page not found</p><p class="fam-msg" style="font-size:16px;margin-top:10px"><a href="/">ungvar.org</a></p>';
  }
</script>
</body>
</html>
